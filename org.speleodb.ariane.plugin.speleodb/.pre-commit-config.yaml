---
exclude: "^bin/"

# default_language_version:
#   python: python3.14

# ========================================================================= #
#                                 FORMATING                                 #
# ========================================================================= #

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      # exclude: ^org.speleodb.ariane.plugin.speleodb/src/main/resources
      - id: end-of-file-fixer
      # exclude: ^org.speleodb.ariane.plugin.speleodb/src/main/resources
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: check-case-conflict
      - id: detect-private-key

  # Resolve the root explicitly for runners launched from this module.
  - repo: local
    hooks:
      - id: java-lint
        name: Java type checking and Error Prone
        language: system
        entry: >-
          bash -c 'repoRoot=$(git rev-parse --show-toplevel) &&
          exec "$repoRoot/gradlew" -p "$repoRoot" --console=plain
          :org.speleodb.ariane.plugin.speleodb:javaLint'
        files: >-
          (?x)(\.java$|\.gradle(\.kts)?$|(^|/)gradle\.properties$|
          ^gradle/|^gradlew(\.bat)?$|(^|/)\.pre-commit-config\.yaml$)
        pass_filenames: false
        require_serial: true
